<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聖徳太子">
<title>聖徳太子</title>
<meta name="description" content="保険営業向けの音声文字起こしアプリ。商談を録音するだけで、提出フォーマット準拠の商談記録を自動生成します。">
<meta name="author" content="TAKOYAKI PROJECT">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="聖徳太子 | TAKOYAKI PROJECT">
<meta property="og:description" content="保険営業向けの音声文字起こしアプリ。商談を録音するだけで、提出フォーマット準拠の商談記録を自動生成します。">
<meta property="og:image" content="https://takoyaki-project.github.io/shoutoku-taishi/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://takoyaki-project.github.io/shoutoku-taishi/ogp.png">
<style>
  :root{
    --paper:#F4F5F3;
    --card:#FBFBFA;
    --ink:#2B302E;
    --muted:#9AA09C;
    --faint:#C7CBC7;
    --line:#E6E8E4;
    --accent:#5B7B77;      /* 落ち着いたスレートグリーン */
    --accent-soft:#5B7B7722;
    --radius:22px;
  }
  /* 録音中(フェーズ1)だけ配色を暗くする。電池対策(OLED省電力)目的。要素の増減は行わず配色のみ変更する。 */
  body.dim-mode{
    --paper:#050505;
    --card:#0D0F0E;
    --ink:#6B706C;
    --muted:#3E413F;
    --faint:#2A2C2A;
    --line:#1B1D1B;
    --accent:#3F5652;
    --accent-soft:#3F565222;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
    transition:background-color .4s ease, color .4s ease;
  }
  .app{max-width:520px;margin:0 auto;padding:14px 16px 48px;}

  /* ---- 目立たないトップバー ---- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 6px 14px;
  }
  header .brand{font-size:12px;letter-spacing:.22em;color:var(--faint);font-weight:600;}
  .gear{
    background:none;border:none;color:var(--faint);
    width:34px;height:34px;font-size:18px;cursor:pointer;line-height:1;
  }

  /* ---- 卓上時計風 待機カード(タップで開始/停止) ---- */
  .clock{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 24px 34px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:transform .12s ease, box-shadow .3s ease;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .clock:active{transform:scale(.992);}
  .clock.rec{
    box-shadow:0 0 0 1px var(--accent-soft), 0 8px 30px rgba(91,123,119,.14);
  }

  /* 時計本体(SVGリング + デジタル表示) */
  .dial{position:relative;width:214px;height:214px;margin:0 auto 8px;}
  .dial svg{position:absolute;inset:0;transform:rotate(-90deg);}
  .dial .track{fill:none;stroke:var(--line);stroke-width:3;}
  .dial .sweep{
    fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:1 999;opacity:0;transition:opacity .5s;
  }
  .clock.rec .dial .sweep{opacity:1;}
  .dial .face{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .time{
    font-size:52px;font-weight:200;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;line-height:1;
    display:none;
  }
  .time .colon{transition:opacity .3s;}
  .time .colon.blink{animation:softblink 2s steps(1) infinite;}
  @keyframes softblink{0%,50%{opacity:1}51%,100%{opacity:.25}}
  /* 待機中(録音していない)の円:時刻の代わりに「録音開始」を表示するボタンとして機能する */
  .idle-prompt{
    font-size:22px;font-weight:600;color:var(--accent);letter-spacing:.1em;
  }
  /* 録音終了ラベル。現在時刻より控えめなサイズ(旧.dateと同格)にする */
  .stop-label{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.14em;display:none;}
  /* 録音セッション中(一時停止・処理中を含む)は、円の中身を「時刻表示」に切り替える */
  body.session-live .idle-prompt{display:none;}
  body.session-live .time{display:block;}
  /* 「録音終了」は、実際にタップで録音を終えられる状態(一時停止・処理中を除く)だけ表示する */
  .clock.rec .stop-label{display:block;}

  /* 待機/記録の状態表示(ごく控えめ) */
  .state{margin-top:22px;height:22px;font-size:13px;color:var(--muted);letter-spacing:.06em;}
  .state .live{color:var(--accent);font-weight:600;}
  .state .live .pip{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin-right:7px;vertical-align:1px;
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
  .elapsed{
    font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);
    letter-spacing:.08em;
  }
  .clock.disabled{opacity:.55;}

  /* ---- 同意チェック ---- */
  .consent{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:14px 4px 0;font-size:12px;color:var(--muted);cursor:pointer;
    user-select:none;letter-spacing:.02em;
  }
  .consent input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .consent input:disabled{cursor:default;opacity:.6;}

  /* ---- 記録モード切替(商談/標準) ---- */
  .mode-toggle-wrap{margin:16px 4px 18px;text-align:center;}
  .mode-toggle-label{
    font-size:11px;color:var(--faint);letter-spacing:.16em;margin-bottom:8px;
  }
  .mode-toggle{
    display:flex;justify-content:center;gap:6px;
  }
  .mode-toggle button{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:6px 16px;border-radius:999px;font-size:12px;cursor:pointer;letter-spacing:.04em;
  }
  .mode-toggle button.active{
    background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:600;
  }

  /* ---- 録音中は「録音専用画面」にする:履歴・料金・議事録形式・同意UIを隠す ---- */
  body.session-live .consent,
  body.session-live .mode-toggle-wrap,
  body.session-live .history-head,
  body.session-live #history{
    display:none;
  }

  /* ---- 中断(一時停止)カード ---- */
  .pause-card{
    display:none;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 20px;margin-top:14px;text-align:center;
  }
  .pause-card p{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:14px;}
  .resume-btn{
    width:100%;padding:16px 0;border-radius:14px;border:none;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;
    letter-spacing:.04em;cursor:pointer;
  }

  /* ---- 処理中/エラー ---- */
  .notice{
    margin-top:14px;padding:14px 16px;border-radius:14px;
    font-size:13px;line-height:1.75;display:none;text-align:left;
  }
  .notice.busy{display:block;background:var(--accent-soft);color:var(--accent);}
  .notice.error{display:block;background:#B44a3a12;color:#A24736;}
  .notice button{
    margin-top:9px;background:none;border:1px solid currentColor;color:inherit;
    padding:7px 15px;border-radius:9px;font-size:12px;cursor:pointer;
  }

  /* ---- 出力フォーマット切替 ---- */
  /* ---- 履歴 ---- */
  .history-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:30px 6px 12px;
  }
  .history-head h2{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.16em;}
  .history-head small{font-size:11px;color:var(--faint);}
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px;margin-bottom:11px;
  }
  .card .meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--muted);margin-bottom:9px;
    font-variant-numeric:tabular-nums;letter-spacing:.04em;
  }
  .card .meta .meta-left{display:flex;align-items:center;gap:7px;}
  .card .meta .meta-right{display:flex;align-items:baseline;gap:7px;}
  .card .meta .cost{font-size:10px;color:var(--faint);}
  .card .meta .badge{
    font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;
    letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);
  }
  .card .meta .badge.memo{background:#9AA09C22;color:var(--muted);}
  .card .tabs{
    display:flex;gap:6px;margin-bottom:11px;
  }
  .card .tabs button{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:5px 12px;border-radius:999px;font-size:11px;cursor:pointer;
    letter-spacing:.04em;
  }
  .card .tabs button.active{
    background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:600;
  }
  .card .text{
    font-size:14px;line-height:1.95;white-space:pre-wrap;word-break:break-word;
    max-height:6.2em;overflow:hidden;position:relative;
  }
  .card.open .text{max-height:none;}
  .card .text.clamped::after{
    content:"";position:absolute;bottom:0;left:0;right:0;height:2em;
    background:linear-gradient(transparent,var(--card));
  }
  .card.open .text.clamped::after{display:none;}
  .card .actions{display:flex;gap:8px;margin-top:13px;}
  .card .actions button{
    flex:1;background:none;border:1px solid var(--line);color:var(--muted);
    padding:9px 0;border-radius:10px;font-size:12px;cursor:pointer;letter-spacing:.04em;
  }
  .card .actions button.primary{color:var(--accent);border-color:var(--accent-soft);}
  .card .actions button.danger{color:#A24736;border-color:#A2473622;}
  .empty{
    text-align:center;color:var(--faint);font-size:13px;padding:30px 0;line-height:1.9;
  }

  /* ---- 設定モーダル ---- */
  .modal-bg{
    position:fixed;inset:0;background:rgba(40,45,42,.4);
    display:none;align-items:flex-end;justify-content:center;z-index:10;
    backdrop-filter:blur(2px);
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:var(--card);border-radius:24px 24px 0 0;
    width:100%;max-width:520px;
    padding:26px 22px calc(30px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(0,0,0,.12);
  }
  .modal h3{font-size:15px;margin-bottom:6px;}
  .modal p{font-size:12px;color:var(--muted);line-height:1.85;margin-bottom:14px;}
  .modal label.fld{display:block;font-size:11px;color:var(--muted);margin:16px 0 6px;letter-spacing:.08em;}
  .modal input, .modal textarea, .modal select{
    width:100%;background:var(--paper);border:1px solid var(--line);
    color:var(--ink);padding:12px 13px;border-radius:11px;font-size:14px;
    font-family:inherit;line-height:1.7;resize:vertical;
    -webkit-appearance:none;appearance:none;
  }
  .modal input.key{font-family:ui-monospace,Menlo,monospace;}
  .modal .row{display:flex;gap:10px;margin-top:20px;}
  .modal .row button{
    flex:1;padding:13px 0;border-radius:13px;font-size:14px;cursor:pointer;border:none;letter-spacing:.04em;
  }
  .btn-save{background:var(--accent);color:#fff;font-weight:600;}
  .btn-cancel{background:none;border:1px solid var(--line)!important;color:var(--muted);}
  .reset-link{
    display:block;width:100%;margin-top:18px;background:none;border:none;
    color:#A24736;font-size:11px;text-decoration:underline;text-underline-offset:2px;
    cursor:pointer;letter-spacing:.02em;text-align:center;
  }

  .toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;
    padding:11px 22px;border-radius:999px;opacity:0;pointer-events:none;
    transition:all .25s;z-index:20;letter-spacing:.04em;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){
    .time .colon.blink,.state .live .pip{animation:none;}
    .clock,.toast{transition:none;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <span class="brand">聖徳太子</span>
    <button class="gear" id="gearBtn" aria-label="設定">⚙</button>
  </header>

  <div class="pause-card" id="recoveryCard">
    <p id="recoveryText">送信できていない録音があります。<br>再送信して報告書を作成しますか？</p>
    <button class="resume-btn" id="recoverBtn">再送信</button>
  </div>

  <label class="consent" id="consentLabel" for="consentCheck">
    <input type="checkbox" id="consentCheck">
    <span>お客様の同意を得ました</span>
  </label>

  <div class="mode-toggle-wrap" id="modeToggleWrap">
    <div class="mode-toggle-label">議事録形式</div>
    <div class="mode-toggle" id="modeToggle" role="tablist" aria-label="議事録形式">
      <button type="button" class="mode-btn active" data-mode="business" id="modeBusinessBtn">商談</button>
      <button type="button" class="mode-btn" data-mode="memo" id="modeMemoBtn">標準</button>
    </div>
  </div>

  <!-- 卓上時計風カード:どこをタップしても録音開始/停止 -->
  <section class="clock" id="clockCard" role="button" tabindex="0" aria-label="タップして録音を開始・終了">
    <div class="dial">
      <svg viewBox="0 0 214 214" aria-hidden="true">
        <circle class="track" cx="107" cy="107" r="101"></circle>
        <circle class="sweep" id="sweep" cx="107" cy="107" r="101"></circle>
      </svg>
      <div class="face">
        <div class="idle-prompt" id="idlePrompt">録音開始</div>
        <div class="time" id="clock"><span id="hh">--</span><span class="colon blink" id="colon">:</span><span id="mm">--</span></div>
        <div class="stop-label" id="stopLabel">録音終了</div>
      </div>
    </div>
    <div class="state" id="state"></div>
  </section>

  <div class="pause-card" id="pauseCard">
    <p>通話などで録音が一時停止しました。<br>ここまでの内容は保存済みです。</p>
    <button class="resume-btn" id="resumeBtn">録音を再開</button>
  </div>

  <div class="notice" id="notice"></div>

  <div class="history-head">
    <h2>記録</h2>
    <small id="count"></small>
  </div>
  <div id="history"></div>

</div>

<!-- 設定モーダル -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>設定</h3>
    <p>録音した音声は、文字起こしのためOpenAIのAPIに送信されます。文字起こし結果と商談記録、APIキーは、この端末のブラウザ内にのみ保存され、当アプリが独自のサーバーに会話データを保管することはありません。</p>
    <label class="fld" for="keyInput">OpenAI APIキー</label>
    <input class="key" type="password" id="keyInput" placeholder="sk-..." autocomplete="off">
    <label class="fld" for="sendMail">完成後の送信先メール（任意）</label>
    <input type="email" id="sendMail" placeholder="日報の提出先など" autocomplete="off">
    <p>コストは概算です。正確な請求はOpenAIのダッシュボードをご確認ください。</p>
    <div class="row">
      <button class="btn-cancel" id="cancelBtn">閉じる</button>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>
    <button class="reset-link" id="resetStuckBtn" type="button">未送信データを削除して初期化</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'koememo_api_key';
  const MAIL = 'koememo_mail';
  const HIST = 'koememo_history_v2';

  // ============================================================
  // ここが唯一の「フォーマット定義」箇所です。
  // 配布先(職場/業種)ごとに書き換える場合は、この1ブロックだけを差し替えてください。
  // ============================================================
  // ============================================================
  // 設定ゾーン: 配布先ごとにカスタマイズするのはこのブロックだけ
  // ============================================================

  // コスト概算の単価設定。実際の請求額とは異なる概算値であり、変更する場合はここだけ編集する。
  const COST_CONFIG = {
    usdJpy: 155, // 円換算レート(固定値。自動取得はしない)
    transcribeModel: 'gpt-4o-mini-transcribe', // 文字起こしに実際に使うモデル名(sendChunkのmodel指定と共通)
    chatModel: 'gpt-4o-mini', // 整形AIに実際に使うモデル名(formatのmodel指定と共通)
    // $/分(文字起こし)。モデルをwhisper-1に戻した場合に備え、使用モデルに応じて単価を切り替える
    transcribeRatePerMinUSD: {
      'gpt-4o-mini-transcribe': 0.003,
      'whisper-1': 0.006,
    },
    // $/1Mトークン(整形AI)
    chatRatePerMTokUSD: {
      'gpt-4o-mini': { input: 0.15, output: 0.60 },
    },
  };

  const REPORT_CONFIG = {
    // AIに渡す整形指示。書式や項目を変えたいときはここを編集する。
    systemPrompt:
`## 役割
あなたは保険会社のプロフェッショナルな秘書、および営業支援アシスタントです。
提供された録音データ（文字起こし）に基づき、正確な社内報告書を1本の要約として作成してください。

## 全体方針
- 各項目は箇条書きの断片ではなく、読んで意味が通る自然な文で記述する。
  項目単体で読んでも、上から通して読んでも商談の流れが理解できることを目指す。
- 情報は落とさない。ただし、録音にない情報を補ってはならない。
  「落とさない」と「創作しない」が衝突する場合は、常に創作しないことを優先する。
- 会話に出た具体（社名・商品名・数値・期間・資料名）は、その項目に関係する限り具体のまま残す。
- 会話の中で語られた既契約（現在加入中の保険の内容・加入経緯・保険会社）は、
  専用項目を設けず、関連する項目（顕在潜在ニード／提案理由／所感備考など）の中で
  話の流れに沿って自然に記述する。落とさないこと。

## 商談種別の判定（最初に必ず実行すること）
出力を作成する前に、この商談が「個人商談」か「法人商談」かを判定せよ。
判定は、以下の手がかりの有無で行う。

法人商談の手がかり（1つでも該当すれば法人と判定する）：
- 相手が「社長」「専務」「常務」「役員」「会長」などの役職で呼ばれている
- 会社・法人・自社株・事業承継・後継者・決算・株主・従業員・役員退職金・
  退職金規程・顧問税理士・法人契約 などの語が出る
- 契約形態として「契約者が会社（法人）」「被保険者が社長・役員」と述べられている

個人商談の手がかり：
- 相手が「◯◯様」と個人名で呼ばれ、家族（配偶者・お子様）・住宅ローン・
  教育資金・老後資金・家計 などの文脈で話が進む

判定結果に応じて、該当する一方のフォーマットのみを使用して出力すること。
両方のフォーマットを混在させたり、個人フォーマットを既定として使ったりしてはならない。
判定に迷う場合は、法人の手がかりが1つでもあれば法人商談として扱う。
判定理由は出力しない（報告書本文のみを出力する）。

## フォーマット（個人商談）
【同席者】
その場に居合わせた人物を記載する。冒頭の挨拶・呼びかけ・本人の発言から判断する。
話題に出ただけの人物（お子様・ご家族など）は含めない。
話者が特定できない場合は「お客様、弊社担当者」のように役割で記載する。

【面談のきっかけ】
今回の面談に至った経緯を記載する。紹介、セミナーやアンケート、以前の電話・訪問、
顧客からの相談、更新・満期の案内など、会話の冒頭や前置きに現れることが多い。
経緯が語られていない場合のみ「（記載なし）」とする。

【顕在潜在ニード】
顧客が言葉にしている要望・不安（顕在）と、会話全体からうかがえる潜在的な必要性（潜在）を、
分けずにまとめて記載する。家族構成、収入、住宅ローン、健康状態、既契約への不満、
将来の心配ごとなど、ニーズの背景となる事実も含めて自然な文にする。
潜在ニーズは、顧客の発言から合理的に読み取れる範囲にとどめ、断定的な決めつけはしない。

【商品への意向】
提案商品や保障内容に対する顧客の考え・希望・優先順位を記載する。
「保障を厚くしたい」「保険料を抑えたい」「運用も考えたい」など顧客側の言葉を軸にする。
顧客が明言していない意向を推測して書いてはならない。

【提案理由】
なぜその商品・保障を提案したのか、担当者側の説明の論理を記載する。
顧客のニーズや既契約の状況と、提案内容がどう結びつくのかが分かるように書く。

【提案内容】
商談で言及された商品名と、金額・期間・回数などの数値条件を記載する。
給付日額、一時金、保険料、払込期間、保障期間、説明に用いた治療費や制度の金額などを、
話された通りに記載する。数値は要約・丸め・換算をしない。
聞き取りが不明瞭な数値や文脈と矛盾する数値には「（要確認）」を付す。
数値が一切出なかった場合は「（記載なし）」とする。

【提案後の反応】
提案に対する顧客の反応・理解度・温度感を記載する。
発言（「前向きに考えたい」「保険料が気になる」等）や、質問の内容、態度を根拠にする。
根拠のない感情の推測（「感動していた」等）は書かない。判断材料がなければ「（記載なし）」。

【他社保険】
他社で加入中・検討中の保険について、保険会社名・商品種類・保障内容・保険料などを
語られた範囲で記載する。社名が話されていれば社名を残し、「他社の保険」と一般化しない。
聞き取りが不明瞭な場合は断定せず「（要確認）」を付す。

【紹介】
紹介者の氏名・関係性・紹介の経緯を記載する。
今後の紹介の可能性について会話があれば、それも含める。

【所感備考】
他の項目に収まらない重要な情報を記載する。商談全体の流れ、決定事項、
現在加入中の保険の内容や経緯、家族・仕事・健康に関する背景情報、
次回に向けた温度感など、担当者が後から読み返して状況を思い出せる内容にする。
雑談（ゴルフ・天気など）は含めない。ただし温度感の判断材料として用いるのはよい。

【課題宿題】
次回までに担当者が準備・確認すべきこと、顧客に依頼したこと、
未解決の懸念点を記載する。会話中の「調べておきます」「確認します」「用意します」等の
発言を根拠にする。期限が語られていれば併記する。

【使用資料】
商談中に参照・提示・言及された資料・書類・画面を列挙する。
資料名が明示されていなくても、「こちらをご覧ください」「ご記入いただく」等の
指示語・動作から資料の存在を読み取り、前後の文脈で種類が特定できる場合は名称を記載する。
種類が特定できない場合は無理に断定せず記載しない。資料名を創作してはならない。

## フォーマット（法人商談）
【現状と課題】
法人の事業内容、規模、役員・従業員の構成、業績、財務、事業承継の状況など、
会話で語られた現状を記載したうえで、そこから生じている課題を記述する。
経営者の問題意識（退職金の準備、相続、税負担、後継者など）が分かるように書く。

【既契約】
現在加入している保険について、保険会社名・商品種類・契約者・被保険者・受取人・
保険金額・保険料・加入時期・目的などを、語られた範囲で記載する。
社名や商品名が話されていれば、一般化せずそのまま残す。

【対策】
課題に対して提示した対策の方向性を記載する。
保険以外の手段（退職金規程の整備、株式の移転、資金繰り等）に触れた場合もここに含める。

【保険提案】
提案した保険の内容を記載する。商品名と、保険金額・保険料・払込期間・
契約形態（契約者・被保険者・受取人）などの条件を、話された通りに記載する。
数値は要約・丸め・換算をせず、不明瞭な数値には「（要確認）」を付す。

【次回】
次回に向けた約束事、準備すべき資料や試算、確認事項、想定している時期を記載する。
会話中の「用意します」「確認します」等の発言を根拠にする。

【懸念】
提案の妨げになりうる要素、経営者の迷い、社内の反対、資金面の制約、
決裁や手続き上の懸念などを記載する。顧客が明言していない懸念を推測で書かない。

## 処理プロセス
1. 事実抽出：録音データから、該当項目の「実際に発言された事実」のみを抜き出す。
2. 種別判定：個人／法人を判定し、使うフォーマットを1つに決める。
3. 構成：抽出した事実をもとに、簡潔でプロフェッショナルな文章にまとめる。
   短い商談は無理に長くせず、話された内容の量に応じた自然な長さにする。
4. 内部検算：出力前に、録音に存在しない情報や推測が混じっていないか自己チェックする。
   このチェックの過程は出力せず、最終版の報告書のみを出力する。

終身保険=一生涯保障が続く保険。有期払込終身保険=保険料の払込を一定期間で終える終身保険。米ドル建終身保険=保険料・保険金が米ドルで運用される終身保険。変額保険=運用実績によって保険金額が変動する保険。定期保険=一定期間だけ保障する保険。無解約返戻金型収入保障保険=解約返戻金がない代わりに保険料が割安な収入保障保険。逓減定期保険=毎年所定の割合で保障額が減っていく定期保険。平準定期保険=保険期間中、保障額が変わらない定期保険。平準定期保険(喫煙リスク区分型)=喫煙の有無で保険料が変わる定期保険。障害介護型=障害・介護状態を保障に含むタイプ。長期平準定期保険=長期間にわたり保障額が変わらない定期保険。養老保険=満期まで生存すると満期保険金が受け取れる保険。特殊養老保険=通常の養老保険に特約を組み合わせたタイプ。特定疾病保険=がん・心疾患・脳血管疾患など特定の病気に備える保険。リビング・ベネフィット=生前給付タイプの保険商品シリーズ名。三大疾病収入保障保険=がん・急性心筋梗塞・脳卒中に備える収入保障保険。がん保険=がんに特化した保障の保険。終身がん保険=一生涯続くがん保険。がん入院保険=がんによる入院に特化した保険。介護保険(生命保険会社の)=要介護状態に備える保険。終身介護保障保険=一生涯続く介護保障保険。年金保険=老後などに年金形式で受け取る保険。変額個人年金保険=運用実績で受取額が変動する年金保険。学資保険=子どもの教育資金に備える保険。団体定期保険=会社などの団体で加入する定期保険。平準定期保険特約=死亡・高度障害の保障を大きくする特約。非喫煙者割引特則=非喫煙者の保険料を割安にする特則。無解約返戻金型=解約返戻金がない代わりに保険料が割安なタイプ。逓減定期保険特約=毎年保障額が減少する特約。優良体・非喫煙者割引特則=健康状態と非喫煙により保険料が割安になる特則。収入保障特約=収入の減少に月々の年金で備える特約。がん特約=がんの入院・手術・在宅療養・診断への保障を加える特約。傷害特約=不慮の事故による死亡・身体障害を保障する特約。災害死亡給付特約=不慮の事故による死亡・高度障害を保障する特約。入院・在宅医療一時金特約=入院や在宅医療による一時的な収入減少に備える特約。がん一時金特約=がん・上皮内がんによる一時的な収入減少に備える特約。円換算払込特約=外貨建て保険料を円で払い込むための特約。円換算支払特約=保険金等を円か外貨か選んで受け取れる特約。リビング・ニーズ特約=余命6ヶ月以内と判断されたとき死亡保険金を前払する特約。ナーシング・ニーズ特約=所定の要介護状態になったとき保険金を前払する特約。保険料払込免除特約=所定の病気や状態になったとき以後の保険料が不要になる特約。年金支払特約=保険金等を年金形式で受け取れる特約。特定疾病診断給付金特約=がん・急性心筋梗塞・脳卒中で一時金が出る特約。抗がん剤治療特約=通院・入院による抗がん剤治療に備える特約。先進医療特約=先進医療を受けた場合の技術料に応じた給付金の特約。責任開始期=保障が始まる時点。失効=保険料未払いなどで契約の効力が失われること。復活=失効した契約を元に戻すこと。更新=保険期間満了時に契約を自動継続すること。解約=契約を終了させること。契約者貸付=解約返戻金の範囲内で資金を借り入れる制度。払済保険=保険料の払込を中止し、保障額を下げて保障を継続する変更。延長保険=保険料の払込を中止し、保障額はそのまま定期保険に変更すること。特約(特則)中途付加=契約の途中で特約を追加すること。減額=保険金額を減らすこと。指定代理請求=本人が請求できないとき代理人が給付金等を請求できる制度。解約返戻金=解約時に払い戻されるお金。既払込保険料証明書=それまでに払い込んだ保険料を証明する書類。契約概要=契約内容の要点をまとめた説明書類。注意喚起情報=契約時に特に注意すべき点をまとめた書類。特別勘定=変額保険で保険料を運用する勘定。繰入比率=特別勘定へ資金を振り分ける割合。積立金移転=特別勘定間で資産を移すこと。医療終身保険(無解約返戻金型)=解約返戻金がない代わりに保険料が割安な医療保障の終身保険。手術給付金=所定の手術を受けたときに支払われる給付金。疾病入院給付金=病気による入院で支払われる給付金。災害入院給付金=事故等の災害による入院で支払われる給付金。給付限度の型(30日型・60日型・120日型)=1回の入院で保障される日数の上限タイプ。初期入院10日給付特則=短期入院でも一律10日分をまとめて受け取れる特則。外来手術増額特則=外来手術の給付金を手厚くする特則。8大生活習慣病入院無制限給付特則=8大生活習慣病による入院を日数無制限で保障する特則。特定3疾病入院無制限給付特則=がん・心疾患・脳血管疾患による入院を日数無制限で保障する特則。継続入院=退院後90日以内の再入院を1回の入院とみなす扱い。先進医療・患者申出療養特約=先進医療や患者申出療養にかかる技術料相当額を保障する特約。入院一時給付特約=入院日数によらず一時金を受け取れる特約。通院治療特約=退院後の通院を保障する特約。8大生活習慣病入院特約=8大生活習慣病による入院を上乗せ保障する特約。女性医療特約=女性疾病による入院・手術を手厚く保障する特約。特定女性疾病通院治療特約=特定女性疾病による通院を保障する特約。特定3疾病一時給付特約=がん・心疾患・脳血管疾患で一時金を受け取れる特約。がん診断特約=がんと診断されたときに一時金を受け取れる特約。薬剤治療特約=抗がん剤等の薬剤治療に備える特約。がん自由診療特約=がんの自由診療・評価療養に備える特約。損傷特約=骨折・ケガ・熱傷・熱中症に備える特約。継続入院・在宅療養収入サポート特約=入院や在宅療養が続いたときの収入減少に備える特約。特定3疾病保険料払込免除特約=特定3疾病で以後の保険料が不要になる特約。がん・介護保険料払込免除特約=がん・要介護状態で以後の保険料が不要になる特約。先進医療=保険診療との併用が認められた高度な医療技術。患者申出療養=患者からの申出を起点に受けられる保険外併用療養。評価療養=保険診療への移行を検討中の療養。自由診療=公的医療保険の対象外で全額自己負担となる診療。上皮内がん=基底膜を超えて浸潤していない初期のがん。高額療養費制度=1か月の自己負担が一定額を超えた分が支給される制度。オピオイド鎮痛薬=脳や脊髄に作用して痛みを抑える鎮痛薬。神経ブロック=局所麻酔薬で痛みの伝達を遮断する治療法。緩和ケア=診断時から行う身体的・精神的苦痛を和らげるケア。傷病手当金=病気やケガで働けない期間の生活を保障する健康保険からの手当金。特定病院=がん自由診療特約の給付対象となる所定の病院。積立金=特別勘定で運用されている、契約ごとの資産部分。積立金の移転=積立金を他の特別勘定に移し替えること。オートリバランス=積立金の構成割合を定期的に元の繰入比率に戻す機能。特別勘定の廃止・統合・移転および繰入の制限=運用環境の変化等により会社が行うことがある措置。変額個人年金保険(無告知型)=告知不要で加入でき、運用実績により年金額が変動する個人年金保険。年金支払期間=年金を受け取る期間(5～40年)。死亡給付金=年金支払開始日前に死亡した際、積立金額と同額支払われる給付金。災害死亡給付金=不慮の事故等で死亡した際、積立金額の1.1倍が支払われる給付金。後継年金受取人=年金受取人死亡後に権利義務を引き継ぐ人。5年ごと利差配当付年金支払特約=解約返戻金相当額を年金基金に充当し定額の年金にする特約。パッシブ型特別勘定=指数連動を目指す運用の特別勘定。アクティブ型特別勘定=市場平均を上回る運用を目指す特別勘定。バランス型特別勘定=株式と債券に分散投資する特別勘定。マネー型特別勘定=短期金利程度の運用を目指す特別勘定。変額保険(終身型)=死亡・高度障害保障が一生涯続き、保険金額が運用実績で変動する保険。基本保険金額=契約時に定め、最低保証される保険金額。変動保険金額=運用実績により増減する保険金額。オプションA(積立機能重視)=運用実績3.0%超で積立金が大きくなるタイプ。オプションB(保障機能重視)=同一運用実績でオプションAより変動保険金額が大きくなるタイプ。解約控除費用=保険料払込10年未満での解約時等にかかる費用。保険料の自動振替貸付=未払保険料を解約返戻金の範囲内で会社が自動的に立て替える制度。買増権保証特約=将来の保険金額買い増しを保証する特約。クーリング・オフ制度=契約から一定期間内であれば無条件で申し込みを撤回できる制度。クーリング・オフの返還金=クーリング・オフ時に払い込んだ保険料が返還されるお金。告知義務=契約者・被保険者が健康状態等を正しく申告する義務。告知受領権=告知を正式に受け取る権限。保険会社と指定医のみが持ち、営業担当者にはない。払込猶予期間=保険契約が有効なまま保険料の払い込みが猶予される期間。失効取消期間=失効後、告知・診査なしで契約を復活できる一定期間。無選択失効取消=特定条件下で、告知・診査なしに失効を取り消せる扱い。保険契約の復活=失効した契約を、延滞保険料と利息の支払いにより元に戻す手続き。保険契約者代理請求人制度=契約者本人が手続きできない事情がある場合に代理人が手続きできる制度。指定代理請求人制度=受取人本人が請求できない事情があるとき指定された代理人が請求できる制度。生命保険会社が経営破綻した場合等=保険会社が破綻した際の契約者保護の取り扱いに関する項目。生命保険契約者保護機構=保険会社破綻時に契約者を保護するための業界機構。反社会的勢力=暴力団関係者など、契約をお断りする対象となる勢力。銀行代理業者=銀行の代理として一部業務を行う者(担当者が兼務している場合の説明項目)。Web約款=紙の約款に代えてホームページ上で確認できる約款。

# 税制
相続税=死亡により財産を相続したときにかかる税。契約者=被保険者の死亡保険金を相続人が受け取る場合はこの対象になる
贈与税=個人から財産をもらったときにかかる税。契約者・被保険者・受取人が全員異なる保険金はこの対象になりうる
所得税=個人の所得にかかる税。契約者=受取人が受け取る満期保険金・解約返戻金は一時所得として所得税の対象になる
譲渡所得=土地・建物・有価証券などの資産を売却して得た所得
一時所得=一時的・偶発的な所得。満期保険金などが該当し、（受取額−払込保険料−特別控除50万円）×1/2が課税対象
法定相続分=民法が定める相続人の取り分の割合（例：配偶者と子なら配偶者1/2・子1/2）
基礎控除=相続税の基礎控除。3000万円＋600万円×法定相続人の数。遺産総額がこれを超えた分に相続税がかかる
死亡保険金の非課税枠=相続人が受け取る死亡保険金のうち「500万円×法定相続人の数」までが非課税になる枠
生命保険料控除=支払った生命保険料に応じて所得から一定額を差し引ける所得控除
満期保険金=保険期間の満了時に受け取るお金
相続人=民法上、被相続人の財産を相続する権利を持つ人
被相続人=亡くなって相続される側の人
遺産分割=相続人どうしで相続財産の分け方を決めること

# 金融・運用
投資信託=投資家から集めた資金を運用会社がまとめて運用する商品。「投信」「ファンド」とも
基準価額=投資信託の1万口あたりの時価。「価格」ではなく「価額」と表記する
信託報酬=投資信託の保有中に日々差し引かれる運用管理費用。「運用管理費用」とも
信託財産留保額=解約時に差し引かれることがある費用
純資産総額=ファンドの資産規模
分散投資=複数の資産・地域・銘柄に分けて投資しリスクを抑えること
積立=毎回一定額を定期的に買い付ける方法。「積立投資」とも
インデックス=市場の指数。指数への連動を目指す運用が「インデックス運用（パッシブ運用）」
アクティブ=指数を上回る成績を目指す運用。「アクティブ運用」
ベンチマーク=運用の目安とする指数
ポートフォリオ=保有資産の組み合わせ
アセットアロケーション=資産配分
リバランス=崩れた資産配分を元の比率に戻すこと
リスク許容度=投資家が受け入れられる損失の範囲
為替ヘッジ=為替変動リスクを抑える仕組み。「ヘッジあり／なし」
複利=運用益がさらに運用に回ることで増える効果
利回り=投資額に対する収益の割合
騰落率=一定期間の値動きの割合
元本=投資したもとのお金。投資信託は元本保証がない
償還=ファンドの運用が終了すること
解約(投資信託)=投資信託を売却して現金化すること。「換金」とも
目論見書=投資信託の説明書。正式には「交付目論見書」
NISA=少額投資非課税制度。2024年からの新NISAは「つみたて投資枠」「成長投資枠」の2枠
つみたて投資枠=新NISAの枠の一つ（旧つみたてNISAに相当）
成長投資枠=新NISAの枠の一つ（旧一般NISAに相当）
iDeCo=個人型確定拠出年金。読みは「イデコ」
確定拠出年金=拠出した掛金を自分で運用する年金制度。企業型と個人型（iDeCo）がある
ドルコスト平均法=一定額ずつ定期購入して平均取得単価を平準化する手法。通称「ドルコスト」

## 指数・銘柄の通称（通称のまま残す）
S&P500=米国の代表的な株価指数。会話では「エスピー」「エスピー500」と呼ばれる。通称のまま残す
オルカン=全世界株式インデックスファンドの通称。正式名称に展開せず「オルカン」のまま残す
オールカントリー=全世界株式を指す呼び方。「オルカン」の由来
日経平均=日経平均株価。「日経225」とも
TOPIX=東証株価指数。読みは「トピックス」
ナスダック=米国の株価指数（NASDAQ）
先進国株式=投資対象地域の分類の一つ
新興国株式=投資対象地域の分類の一つ
REIT=不動産投資信託。読みは「リート」

## 変額・外貨建て
変額年金=運用実績に応じて年金額が変動する個人年金保険
外貨建て保険=保険料・保険金を外貨で扱う保険

# 病気（三大疾病・がん関連）
悪性新生物=がんの正式名称。約款・保障の対象疾病はこの表記。会話の「がん」と同じもの
がん=悪性新生物のこと。会話ではこちらを使う
三大疾病=悪性新生物・急性心筋梗塞・脳卒中の総称
上皮内新生物=上皮内にとどまる新生物。約款上の正式表記（がんの前段階を含む区分）。
  会話語「上皮内がん」・約款語「上皮内癌」と同じものを指す(用語集冒頭の「上皮内がん」の項も参照)
急性心筋梗塞=冠動脈の閉塞などで心筋が壊死する疾患。約款上の正式表記
再発性心筋梗塞=再発した心筋梗塞。約款上の表記
心筋梗塞=会話語。約款上は「急性心筋梗塞」「再発性心筋梗塞」として区分される
脳卒中=脳血管疾患の総称。くも膜下出血・脳内出血・脳梗塞を含む
くも膜下出血=脳卒中の一つ。会話では「くも膜下」とも
脳内出血=脳卒中の一つ
脳梗塞=脳卒中の一つ。会話で頻出

# 使用資料
告知書=契約申込時に健康状態などを記入する書類。「ご記入いただく」書類として言及されることが多い
重要事項説明書=契約前に必ず説明する書類。「重要事項」「重説」とも呼ばれる
ご契約のしおり=契約内容と約款をまとめた冊子
約款=契約条件を定めた文書

# 法人
退職金規程=役員・従業員の退職金の支給ルールを定めた社内規程。「規定」ではなく「規程」と表記する`,
  };

  // メモモード用の整形プロンプト。商談用の辞書(DICTIONARY_CONFIG)は適用しない。
  const MEMO_CONFIG = {
    systemPrompt:
`## 役割
提供された録音の文字起こしをもとに、あとで見返して要点が分かるメモを作成してください。
保険商談とは限らない、日常のさまざまな場面(説明会、集まり、訪問、打ち合わせなど)の記録です。

## フォーマット
【日時・場所】(話に出れば記載。なければ記載なし)
【相手・参加者】(誰と話したか、誰が話していたか。なければ記載なし)
【テーマ】(何についての話か)
【要点】(話の中身の要点を、自然な文章で。ここを中心に記述する)
【決まったこと】(結論・合意・決定事項があれば記載。なければ記載なし)
【持ち帰り・宿題】(次にやること、確認すること、期限があれば記載。なければ記載なし)

## 厳守事項
- 録音に存在しない情報を創作しない。不明な項目は「(記載なし)」とする。
- 例え話や仮定の話の内容を、事実として記載しない。
- 雑談は要点に含めない(ただし場の雰囲気の把握に用いるのはよい)。
- 数値・固有名詞は、話された通りに記載する。聞き取りが不明瞭なものには「(要確認)」を付す。
- 短い録音は無理に膨らませず、話された量に応じた自然な長さにする。
- 検算は内部で行い、出力にはメモ本文のみを記載する。`,
  };

  const $ = id => document.getElementById(id);
  const clockCard=$('clockCard'), hhEl=$('hh'), mmEl=$('mm'), colonEl=$('colon'),
        stateEl=$('state'), sweepEl=$('sweep'),
        noticeEl=$('notice'), historyEl=$('history'), countEl=$('count'),
        modalBg=$('modalBg'), keyInput=$('keyInput'), mailInput=$('sendMail'),
        toastEl=$('toast'), consentCheck=$('consentCheck'),
        pauseCardEl=$('pauseCard'), resumeBtnEl=$('resumeBtn'),
        recoveryCardEl=$('recoveryCard'), recoverBtnEl=$('recoverBtn'), recoveryTextEl=$('recoveryText'),
        modeBusinessBtn=$('modeBusinessBtn'), modeMemoBtn=$('modeMemoBtn');

  const R = 101, CIRC = 2 * Math.PI * R;
  const CHUNK_MS = 10 * 60 * 1000; // 10分ごとにチャンクを確定(以前は15分。サイズ超過対策で短縮)
  const CHUNK_SIZE_SOFT_LIMIT = 20 * 1024 * 1024; // 送信上限(24MB)に達する前に、時間を待たず早めにチャンクを区切る

  let mediaRecorder=null, chunks=[], stream=null;
  let recording=false, startTime=0, uiTimer=null;
  let audioCtx=null, wakeLock=null;
  let lastDuration=0, mimeType='', ext='';

  // ===== 長時間録音(チャンク分割)のセッション状態 =====
  // 各チャンクは {idx, blob, status:'recorded'|'sending'|'done'|'failed', text, attempts, authError} で保持する。
  // 送信に失敗しても blob は破棄せず、復帰後・オンライン復帰後・停止後にまとめて再送する。
  let sessionActive=false, paused=false, ending=false, awaitingRetry=false;
  // recordMode: UIで選択中のモード(常に'business'が初期値)。sessionMode: 録音開始時に確定させ、
  // セッション中はUI操作の影響を受けない値(録音中/送信中に辞書・プロンプトの適用がぶれないようにする)。
  let recordMode='business', sessionMode='business';
  function setMode(mode){
    recordMode = mode;
    modeBusinessBtn.classList.toggle('active', mode==='business');
    modeMemoBtn.classList.toggle('active', mode==='memo');
  }
  modeBusinessBtn.onclick = () => setMode('business');
  modeMemoBtn.onclick = () => setMode('memo');
  let chunkList=[], rotateTimer=null, queuePromise=null, sessionId=null;
  const MAX_RETRY = 3, RETRY_DELAY_MS = 4000;

  // ===== 永続化(IndexedDB) =====
  // 確定したチャンクは音声Blob付きで即座にIndexedDBへ保存し、送信失敗・リロード・
  // アプリ終了があっても失われないようにする。失敗しても録音自体は止めず、console.logのみに留める。
  const DB_NAME = 'shotokutaishi_db', DB_VERSION = 1;
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains('chunks')){
          const store = db.createObjectStore('chunks', { keyPath:'key' });
          store.createIndex('sessionId', 'sessionId', { unique:false });
        }
        if(!db.objectStoreNames.contains('sessions')){
          db.createObjectStore('sessions', { keyPath:'sessionId' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function idbPut(storeName, value){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(value);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGetAll(storeName){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction(storeName, 'readonly').objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbGetAllByIndex(storeName, indexName, value){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const req = db.transaction(storeName, 'readonly').objectStore(storeName).index(indexName).getAll(value);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // チャンク1件を保存(done済みなら容量節約のため音声Blobは保存しない)
  async function persistChunk(c){
    try{
      await idbPut('chunks', {
        key: `${sessionId}_${c.idx}`, sessionId, idx: c.idx,
        blob: c.status==='done' ? null : c.blob,
        status: c.status, text: c.text, attempts: c.attempts, authError: c.authError,
        sizeExceeded: c.sizeExceeded
      });
    }catch(e){ console.log('[IndexedDB] チャンク保存に失敗', e); }
  }
  async function touchSession(){
    try{
      await idbPut('sessions', {
        sessionId, startTime, elapsedSec: Math.floor((Date.now()-startTime)/1000),
        // このチャンク確定の直後に録音を継続したか(true=ローテーション、false=一時停止/終了操作による確定)。
        // 起動時、trueのまま残っているセッションは「録音継続中に無予告で途切れた」と判断できる。
        continuingAfter: !paused && !ending,
        mode: sessionMode // 復旧時に辞書・プロンプトの適用を誤らないよう、このセッションのモードも保存する
      });
    }catch(e){ console.log('[IndexedDB] セッション情報の保存に失敗', e); }
  }
  // セッション完了・破棄時に、そのセッションのチャンク・セッションレコードを全削除する
  async function clearSessionFromDB(sid){
    try{
      const db = await openDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(['chunks','sessions'], 'readwrite');
        const cursorReq = tx.objectStore('chunks').index('sessionId').openCursor(IDBKeyRange.only(sid));
        cursorReq.onsuccess = e => { const cur=e.target.result; if(cur){ cur.delete(); cur.continue(); } };
        tx.objectStore('sessions').delete(sid);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }catch(e){ console.log('[IndexedDB] セッション削除に失敗', e); }
  }
  // 「未送信データを削除して初期化」ボタン用:chunks/sessionsストアを丸ごと空にする。
  // 完了済みの商談記録・メモはlocalStorage(HIST)にのみ保存されIndexedDBには一切書かれないため、
  // このストアの中身は常に「未処理・未送信のセッション」だけであり、丸ごと削除しても既存の履歴は失われない。
  async function clearAllPendingSessions(){
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(['chunks','sessions'], 'readwrite');
      tx.objectStore('chunks').clear();
      tx.objectStore('sessions').clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // 起動時:未完了セッションが残っていれば復旧バナーを出す
  async function checkForRecovery(){
    try{
      const sessions = await idbGetAll('sessions');
      if(!sessions.length) return;
      sessions.sort((a,b)=>b.startTime-a.startTime);
      const s = sessions[0];
      const storedChunks = await idbGetAllByIndex('chunks','sessionId', s.sessionId);
      if(!storedChunks.length){ await clearSessionFromDB(s.sessionId); return; }
      showRecoveryBanner(s, storedChunks);
    }catch(e){ console.log('[IndexedDB] 復旧チェックに失敗', e); }
  }
  function showRecoveryBanner(s, storedChunks){
    // continuingAfterがtrueのまま残っている = 録音継続中に無予告で途切れた(電池切れ等)可能性が高い
    recoveryTextEl.innerHTML = s.continuingAfter
      ? '送信できていない録音があります。<br>録音が予期せず終了したため、直前の内容は記録されていない可能性があります。<br>再送信して報告書を作成しますか？'
      : '送信できていない録音があります。<br>再送信して報告書を作成しますか？';
    recoveryCardEl.style.display = 'block';
    recoverBtnEl.disabled = false;
    recoverBtnEl.onclick = async () => {
      recoverBtnEl.disabled = true; // 二度押し防止
      recoveryCardEl.style.display = 'none';
      await recoverSession(s, storedChunks);
    };
  }
  // 保存されていたチャンクからchunkListを復元し、既存の送信→整形フローに合流する
  async function recoverSession(s, storedChunks){
    sessionId = s.sessionId;
    lastDuration = s.elapsedSec || 0;
    sessionMode = s.mode || 'business'; // 旧データにmodeが無い場合は商談扱いにする
    chunkList = storedChunks
      .slice()
      .sort((a,b)=>a.idx-b.idx)
      .map(sc => ({
        idx: sc.idx, blob: sc.blob,
        status: sc.status==='done' ? 'done' : 'recorded', // 未完了分はもう一度送信させる
        text: sc.text, attempts: 0, authError: false, sizeExceeded: false
      }));
    stateEl.textContent = '処理中…';
    await finalizeSession();
  }

  // ===== 時計表示 =====
  function pad(n){ return String(n).padStart(2,'0'); }
  function updateClock(){
    const now = new Date();
    hhEl.textContent = pad(now.getHours());
    mmEl.textContent = pad(now.getMinutes());
    // 録音中は秒に応じてリングをゆっくり回す(秒針のように=時計に見える)
    if (recording){
      const sec = now.getSeconds() + now.getMilliseconds()/1000;
      const len = (sec/60) * CIRC;
      sweepEl.style.strokeDasharray = `${len} ${CIRC}`;
    }
  }
  setInterval(updateClock, 250);
  updateClock();

  // ===== 録音フォーマット判定 =====
  function pickMime(){
    const c=[['audio/mp4','mp4'],['audio/webm;codecs=opus','webm'],['audio/webm','webm']];
    for(const [m,e] of c){ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return [m,e]; }
    return ['','webm'];
  }
  function fmtTime(sec){ return `${pad(Math.floor(sec/60))}:${pad(Math.floor(sec%60))}`; }

  function notice(type, html){ noticeEl.className='notice '+type; noticeEl.innerHTML=html; }
  function clearNotice(){ noticeEl.className='notice'; noticeEl.innerHTML=''; }
  function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1900); }

  // ===== 録音 =====
  async function start(){
    if(!consentCheck.checked){ toast('お客様の同意を確認してください'); return; }
    if(!localStorage.getItem(KEY)){ openModal(); toast('先にAPIキーを設定してください'); return; }
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ notice('error','マイクを使用できませんでした。設定 → Safari → マイク で許可を確認してください。'); return; }
    clearNotice();
    [mimeType, ext] = pickMime();
    try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch(e){}

    sessionActive=true; paused=false; ending=false;
    sessionMode = recordMode; // 以後このセッションが完了するまで、UIでの切替に関わらずこのモードで統一する
    chunkList=[];
    sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    recording=true; startTime=Date.now();
    clockCard.classList.add('rec');
    colonEl.classList.remove('blink');   // 録音中はコロンが点滅を止める(操作者だけが分かる合図)
    document.body.classList.add('dim-mode'); // 録音中(フェーズ1)は配色を暗くして電池を節約する
    document.body.classList.add('session-live'); // 録音専用画面へ(履歴・議事録形式・同意UIを隠す)
    consentCheck.disabled = true; // 録音開始後は同意確認を変更できないようにする
    renderState();
    uiTimer = setInterval(renderState, 500);
    beginChunk();
  }

  // 新しいチャンクのMediaRecorderを開始し、10分後の自動確定を予約する
  function beginChunk(){
    chunks=[];
    mediaRecorder = new MediaRecorder(stream, mimeType?{mimeType}:undefined);
    mediaRecorder.ondataavailable = e => {
      if(e.data.size>0) chunks.push(e.data);
      // 送信上限(24MB)に達する前に、時間経過を待たず早めにローテーションする(サイズ超過の予防)
      const total = chunks.reduce((sum,b)=>sum+b.size, 0);
      if(total>=CHUNK_SIZE_SOFT_LIMIT) rotateChunk();
    };
    mediaRecorder.onstop = handleChunkStopped;
    mediaRecorder.start(1000);
    clearTimeout(rotateTimer);
    rotateTimer = setTimeout(rotateChunk, CHUNK_MS);
  }

  // 10分経過、またはサイズ上限接近:録音を途切れさせずにMediaRecorderだけ切り替える(handleChunkStoppedが次チャンクを開始する)
  function rotateChunk(){
    if(!sessionActive || paused || ending) return;
    if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
  }

  function renderState(){
    const sec = Math.floor((Date.now()-startTime)/1000);
    stateEl.innerHTML = `<span class="live"><span class="pip"></span>記録中</span>　<span class="elapsed">${fmtTime(sec)}</span>`;
  }

  // ユーザーが時計をタップしてセッション全体を終える
  function stop(){
    ending=true;
    clearTimeout(rotateTimer);
    lastDuration = Math.floor((Date.now()-startTime)/1000);
    recording=false;
    clearInterval(uiTimer);
    if(audioCtx){ audioCtx.close(); audioCtx=null; }
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
    clockCard.classList.remove('rec');
    colonEl.classList.add('blink');
    document.body.classList.remove('dim-mode'); // フェーズ2(処理中)は通常表示に戻す
    sweepEl.style.strokeDasharray = `1 ${CIRC}`;
    stateEl.textContent = '処理中…';
    if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
    if(stream){ stream.getTracks().forEach(t=>t.stop()); }
  }

  // ===== 中断対策(バックグラウンド遷移) =====
  document.addEventListener('visibilitychange', () => {
    if(document.hidden && sessionActive && !paused && !ending) enterPaused();
  });

  // ネットワーク復帰時:フェーズ2(送信)で再送信待ちのまま止まっているときだけ自動で再送信を試みる。
  // 録音中(フェーズ1)は通信しない方針のため、ここでは発火しない。
  window.addEventListener('online', () => {
    if(awaitingRetry) manualRetry();
  });

  function enterPaused(){
    paused=true;
    clearTimeout(rotateTimer);
    clearInterval(uiTimer);
    if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    wakeLock=null; // バックグラウンド遷移で自動解放されるため参照だけリセットする
    clockCard.classList.remove('rec');
    document.body.classList.remove('dim-mode'); // 一時停止中は通常表示に戻す
    stateEl.textContent='一時停止中';
    pauseCardEl.style.display='block';
  }

  resumeBtnEl.onclick = async () => {
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ notice('error','マイクを再度取得できませんでした。設定 → Safari → マイク で許可を確認してください。'); return; }
    try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch(e){}
    paused=false;
    pauseCardEl.style.display='none';
    clockCard.classList.add('rec');
    colonEl.classList.remove('blink');
    document.body.classList.add('dim-mode'); // 録音再開(フェーズ1再開)にあわせて暗表示に戻す
    recording=true;
    renderState();
    uiTimer = setInterval(renderState, 500);
    beginChunk();
    // 送信はここでは行わない。中断中に確定したチャンクも、停止後のフェーズ2でまとめて送信する。
  };

  // MediaRecorderが停止するたびに呼ばれる(10分ローテーション/中断/最終停止のいずれでも共通)。
  // ここでは録音データの確定・保存のみを行い、送信は行わない(送信は停止後のfinalizeSessionに集約)。
  async function handleChunkStopped(){
    const blob = new Blob(chunks,{type:mimeType||'audio/webm'});
    chunks=[];
    const idx = chunkList.length;

    // 唯一のチャンクで、かつ終了操作による停止 → 従来通り「短すぎる録音」エラーとしてセッションを中断
    if(ending && idx===0 && blob.size<2000){
      resetSessionState();
      resetState();
      notice('error','録音が短すぎるようです。もう一度お試しください。');
      return;
    }

    // 録音データの確保を最優先:送信の成否に関わらず、まず必ず'recorded'として保存する
    const c = { idx, blob, status:'recorded', text:null, attempts:0, authError:false, sizeExceeded:false };
    chunkList.push(c);

    // 録音を継続する場合は、DB書き込みの完了を待たず先に次のチャンクを開始する(録音の空白を避ける)
    if(!ending && !paused) beginChunk();

    await persistChunk(c);  // IndexedDBへ保存。ここでawaitし、確定済みチャンクが保存前に失われる窓をなくす
    await touchSession();

    if(ending) finalizeSession(); // 停止操作のときだけフェーズ2(送信〜要約)へ進む
    // 録音継続中・一時停止中はここでは送信しない。送信はすべて停止後にまとめて行う。
  }

  function resetState(){ stateEl.textContent=''; } // 円の下の説明文は「録音開始」表示と重複するため出さない

  function resetSessionState(){
    const sidToClean = sessionId;
    sessionActive=false; paused=false; ending=false;
    chunkList=[]; sessionId=null;
    mediaRecorder=null; stream=null;
    pauseCardEl.style.display='none';
    document.body.classList.remove('session-live'); // 録音専用画面を解除し、履歴・議事録形式・同意UIを戻す
    consentCheck.checked=false; // 録音1回ごとに同意を取り直す
    consentCheck.disabled=false;
    updateConsentUI();
    setMode('business'); // 標準モードのまま次の商談を録ってしまう事故を防ぐため、毎回商談に戻す
    if(sidToClean){
      clearSessionFromDB(sidToClean).then(checkForRecovery); // 完了したセッションを片付け、他に残っているものがあれば続けて案内する
    }
  }

  // ===== 文字起こし(Whisper) → 必要なら整形(Chat) =====
  function applyExactReplace(text){
    let result = text;
    for (const [wrong, right] of Object.entries(DICTIONARY_CONFIG.exactReplace)){
      if (result.includes(wrong)){
        console.log('[辞書置換]', wrong, '->', right);
        result = result.split(wrong).join(right);
      }
    }
    return result;
  }

  // 1チャンク分をWhisperに送信する。直前チャンクの文字起こし末尾をpromptに連結し文脈をつなぐ。
  // 失敗してもchunkListからは削除せず、'failed'として保持する(最大MAX_RETRY回まで自動リトライ)。
  async function sendChunk(c){
    if(c.blob.size<2000){ c.status='done'; c.text=''; await persistChunk(c); return; } // 最終チャンクの端数など、極端に短いものは無視
    if(c.blob.size>24*1024*1024){
      // サイズ超過はリトライしても改善しない(再送信では直らない)。sizeExceededでその旨を区別する。
      c.status='failed'; c.attempts=MAX_RETRY; c.sizeExceeded=true;
      await persistChunk(c);
      return;
    }
    c.status='sending';
    const key = localStorage.getItem(KEY);
    const fd = new FormData();
    fd.append('file', c.blob, `rec_${c.idx}.`+ext);
    // response_formatは未指定=デフォルトのjsonを使用。gpt-4o-mini-transcribeはjson/textのみ対応
    // (verbose_json/srt/vttはwhisper-1専用)なので、data.textを読むこの実装のままで互換。
    // 第1層(DICTIONARY_CONFIG.whisperPrompt)は使わない方針(useWhisperPrompt=false)。
    fd.append('model', COST_CONFIG.transcribeModel);
    fd.append('language','ja');
    if(DICTIONARY_CONFIG.useWhisperPrompt && sessionMode!=='memo'){
      let promptText = DICTIONARY_CONFIG.whisperPrompt;
      if(c.idx>0){
        const prev = chunkList[c.idx-1];
        const tail = ((prev && prev.text) || '').slice(-150);
        if(tail) promptText += ' ' + tail;
      }
      fd.append('prompt', promptText);
    }
    try{
      const res = await fetch('https://api.openai.com/v1/audio/transcriptions',{
        method:'POST', headers:{'Authorization':'Bearer '+key}, body:fd
      });
      if(!res.ok){
        const err = new Error('http'+res.status); err.status = res.status; throw err;
      }
      const data = await res.json();
      const transcribed = (data.text||'').trim();
      // メモモードでは保険用語辞書を適用しない(日常会話の誤変換を防ぐ)
      c.text = sessionMode==='memo' ? transcribed : applyExactReplace(transcribed);
      c.status = 'done';
      await persistChunk(c); // 保存してからメモリ上の音声Blobを解放する
      c.blob = null;
    }catch(e){
      c.attempts++;
      if(e && e.status===401) c.authError = true;
      console.log(`[チャンク${c.idx+1}] 送信失敗(${c.attempts}回目)`, e);
      if(c.attempts < MAX_RETRY && !paused){
        await new Promise(r=>setTimeout(r, RETRY_DELAY_MS));
        await sendChunk(c);
        return;
      }
      c.status = 'failed';
      await persistChunk(c);
    }
  }

  function doneCount(){ return chunkList.filter(c=>c.status==='done').length; }

  // chunkList内の未送信('recorded')・再送待ち('failed'かつリトライ上限未満)を順番に送信するキュー処理。
  // 同時に複数箇所から呼ばれても二重実行しないよう、実行中のPromiseを使い回す。
  function processPendingChunks(verbose){
    if(queuePromise) return queuePromise;
    queuePromise = runQueue(!!verbose).finally(()=>{ queuePromise=null; });
    return queuePromise;
  }
  async function runQueue(verbose){
    for(const c of chunkList){
      if(c.status==='done' || c.status==='sending') continue;
      if(c.status==='failed' && c.attempts>=MAX_RETRY) continue; // 自動リトライ上限。手動再送信待ち
      if(paused) return; // 中断中は録音データ確保を優先し、送信は試みない
      if(verbose) notice('busy', `未送信のチャンクを送信中…(${doneCount()}/${chunkList.length})`);
      await sendChunk(c);
      if(verbose) notice('busy', `未送信のチャンクを送信中…(${doneCount()}/${chunkList.length})`);
    }
  }

  // 停止操作後、残っている未送信・失敗チャンクをすべて送り切ってから、録音順に連結して整形AIに渡す
  async function finalizeSession(){
    awaitingRetry = false;
    await processPendingChunks(true);
    // サイズ超過(sizeExceeded)は再送信しても直らないため、要約進行のブロック要因から除外する。
    // それ以外の未完了(ネットワーク/認証エラーなど)だけをブロック要因として扱う。
    const sizeExceededChunks = chunkList.filter(c=>c.status!=='done' && c.sizeExceeded);
    const blockingPending = chunkList.filter(c=>c.status!=='done' && !c.sizeExceeded);
    if(blockingPending.length>0){
      awaitingRetry = true; // オンライン復帰時に自動再送信の対象とする
      stateEl.textContent = '処理中…';
      const authFailed = blockingPending.some(c=>c.authError);
      let msg;
      if(authFailed){
        msg = 'APIキーが正しくないようです。設定(⚙)から確認してください。';
      }else if(sizeExceededChunks.length>0){
        msg = '一部の録音は長すぎて送信できません(再送信では直りません)。'
            + 'それ以外の録音は、電波の良い場所で「再送信」を押すと送信できる場合があります。';
      }else{
        msg = '一部の録音が送信できませんでした。電波の良い場所で「再送信」を押してください。';
      }
      notice('error', msg + '<br><button id="manualRetryBtn">再送信</button>');
      $('manualRetryBtn').onclick = manualRetry;
      return; // 整形には進まない。録音データ(chunkList)は保持したまま
    }
    // サイズ超過チャンクだけが残っている場合は、それを諦めて手元にある分だけで要約に進む
    const raw = chunkList.filter(c=>!c.sizeExceeded).map(c=>c.text).filter(t=>t).join('\n')
      || '（音声を認識できませんでした）';
    notice('busy','内容を整えています…');
    const key = localStorage.getItem(KEY);
    const result = await format(raw, key, sessionMode);
    const costJPY = calcCostJPY(lastDuration, result && result.usage);
    const sizeWarning = sizeExceededChunks.length>0
      ? '一部の録音は長すぎて文字起こしできず、この記録には反映されていません。'
      : null;
    finish(result ? result.text : null, raw, costJPY, sizeWarning);
    resetSessionState();
  }

  // 録音時間(秒)とchat completionsのusageから、概算コスト(円・整数)を計算する。
  // 録音時間は一時停止を挟んだセッションでは実際の音声時間よりやや多めに出ることがあるが、
  // あくまで概算表示のためのものなので、既存のlastDurationをそのまま使う。
  function calcCostJPY(durationSec, usage){
    const transcribeRate = COST_CONFIG.transcribeRatePerMinUSD[COST_CONFIG.transcribeModel] || 0;
    const transcribeUSD = (durationSec/60) * transcribeRate;
    let chatUSD = 0;
    const chatRate = COST_CONFIG.chatRatePerMTokUSD[COST_CONFIG.chatModel];
    if(usage && chatRate){
      chatUSD = (usage.prompt_tokens||0)/1e6*chatRate.input + (usage.completion_tokens||0)/1e6*chatRate.output;
    }
    return Math.round((transcribeUSD + chatUSD) * COST_CONFIG.usdJpy);
  }

  // 「再送信」ボタン: 失敗チャンクのリトライ回数をリセットしてもう一度送信を試みる
  async function manualRetry(){
    const btn = $('manualRetryBtn');
    if(btn) btn.disabled = true; // 二度押し防止
    for(const c of chunkList){ if(c.status==='failed') c.attempts=0; }
    clearNotice();
    await finalizeSession();
  }

  async function format(text, key, mode){
    // メモモードは商談用フォーマット・辞書を使わず、メモ専用の単体プロンプトのみ渡す
    const systemPrompt = mode==='memo'
      ? MEMO_CONFIG.systemPrompt
      : REPORT_CONFIG.systemPrompt + '\n' + DICTIONARY_CONFIG.llmGlossary + '\n\n' + DICTIONARY_CONFIG.contextNotes;
    try{
      const res = await fetch('https://api.openai.com/v1/chat/completions',{
        method:'POST',
        headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
        body:JSON.stringify({
          model: COST_CONFIG.chatModel,
          messages:[{role:'system',content:systemPrompt},{role:'user',content:text}],
          temperature:0.2
        })
      });
      if(!res.ok) return null;
      const d = await res.json();
      return { text: (d.choices?.[0]?.message?.content||'').trim(), usage: d.usage || null };
    }catch(e){ return null; }
  }

  function finish(text, raw, costJPY, warningMsg){
    saveEntry(text || raw, raw, lastDuration, costJPY, sessionMode);
    if(warningMsg){ notice('error', warningMsg); } else { clearNotice(); }
    resetState();
    toast('記録が完成しました');
  }

  // ===== 履歴 =====
  function loadHistory(){ try{return JSON.parse(localStorage.getItem(HIST))||[];}catch(e){return [];} }
  function saveEntry(text, raw, duration, costJPY, mode){
    const list=loadHistory();
    list.unshift({
      id:Date.now(),
      date:new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),
      duration:fmtTime(duration), text, raw, costJPY, mode:mode||'business'
    });
    localStorage.setItem(HIST, JSON.stringify(list));
    renderHistory();
  }
  function deleteEntry(id){
    localStorage.setItem(HIST, JSON.stringify(loadHistory().filter(e=>e.id!==id)));
    renderHistory();
  }
  function renderHistory(){
    const list=loadHistory();
    if(!list.length){
      countEl.textContent = '';
      historyEl.innerHTML='<div class="empty">まだ記録がありません。<br>面談のあとに、ここへ整理された記録が並びます。</div>';
      return;
    }
    const now = new Date();
    const monthTotal = list.reduce((sum,e)=>{
      if(typeof e.costJPY!=='number') return sum;
      const d = new Date(e.id);
      const sameMonth = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
      return sameMonth ? sum+e.costJPY : sum;
    }, 0);
    countEl.textContent = `${list.length}件・今月:約${monthTotal.toLocaleString('ja-JP')}円`;
    historyEl.innerHTML='';
    const mail = localStorage.getItem(MAIL)||'';
    for(const e of list){
      const hasRaw = e.raw;
      const isMemo = e.mode==='memo';
      const kindLabel = isMemo ? '標準記録' : '商談記録';
      const costText = typeof e.costJPY==='number' ? `約${e.costJPY.toLocaleString('ja-JP')}円` : '-';
      const card=document.createElement('div'); card.className='card';
      card.innerHTML=`
        <div class="meta"><span class="meta-left"><span class="badge${isMemo?' memo':''}">${kindLabel}</span>${e.date}</span><span class="meta-right">${e.duration}<span class="cost">${costText}</span></span></div>
        ${hasRaw ? `<div class="tabs">
          <button class="tab-fmt active" data-tab="fmt">${kindLabel}</button>
          <button class="tab-raw" data-tab="raw">話した内容そのまま</button>
        </div>` : ''}
        <div class="text"></div>
        <div class="actions">
          <button class="copy">コピー</button>
          <button class="primary mail">メールで送る</button>
          <button class="expand">全文</button>
          <button class="danger del">削除</button>
        </div>`;
      const t=card.querySelector('.text');
      let showingRaw = false;
      const renderText = () => {
        t.textContent = showingRaw ? e.raw : e.text;
        t.classList.remove('clamped');
        requestAnimationFrame(()=>{
          if(t.scrollHeight>t.clientHeight+4 && !card.classList.contains('open')) t.classList.add('clamped');
        });
      };
      renderText();
      const expandBtn = card.querySelector('.expand');
      requestAnimationFrame(()=>{
        if(t.scrollHeight<=t.clientHeight+4) expandBtn.style.display='none';
      });
      if(hasRaw){
        const tabFmt = card.querySelector('.tab-fmt'), tabRaw = card.querySelector('.tab-raw');
        tabFmt.onclick=()=>{ showingRaw=false; tabFmt.classList.add('active'); tabRaw.classList.remove('active'); renderText(); };
        tabRaw.onclick=()=>{ showingRaw=true; tabRaw.classList.add('active'); tabFmt.classList.remove('active'); renderText(); };
      }
      card.querySelector('.copy').onclick=async()=>{ try{await navigator.clipboard.writeText(showingRaw?e.raw:e.text);toast('コピーしました');}catch(err){toast('コピーできませんでした');} };
      card.querySelector('.mail').onclick=()=>{
        const subject=encodeURIComponent(`${kindLabel} ${e.date}`);
        const body=encodeURIComponent(e.text);
        const to=encodeURIComponent(mail);
        location.href=`mailto:${to}?subject=${subject}&body=${body}`;
      };
      expandBtn.onclick=ev=>{ card.classList.toggle('open'); ev.target.textContent=card.classList.contains('open')?'閉じる':'全文'; };
      card.querySelector('.del').onclick=()=>{ if(confirm('この記録を削除しますか?')) deleteEntry(e.id); };
      historyEl.appendChild(card);
    }
  }

  // ===== 設定 =====
  function openModal(){
    keyInput.value=localStorage.getItem(KEY)||'';
    mailInput.value=localStorage.getItem(MAIL)||'';
    modalBg.classList.add('show');
  }
  $('gearBtn').onclick=openModal;
  $('cancelBtn').onclick=()=>modalBg.classList.remove('show');
  modalBg.onclick=e=>{ if(e.target===modalBg) modalBg.classList.remove('show'); };
  $('saveBtn').onclick=()=>{
    const k=keyInput.value.trim(), m=mailInput.value.trim();
    if(k && !k.startsWith('sk-')){ toast('「sk-」で始まるキーを入力してください'); return; }
    k?localStorage.setItem(KEY,k):localStorage.removeItem(KEY);
    m?localStorage.setItem(MAIL,m):localStorage.removeItem(MAIL);
    modalBg.classList.remove('show');
    toast('保存しました');
    renderHistory();
  };
  $('resetStuckBtn').onclick = async () => {
    if(!confirm('送信できていない録音データを削除します。完了済みの記録は残ります。よろしいですか?')) return;
    try{
      await clearAllPendingSessions();
    }catch(e){
      console.log('[IndexedDB] 未送信データの削除に失敗', e);
      toast('削除に失敗しました');
      return;
    }
    // 画面に残っている「詰まった」表示・状態もあわせてクリアする
    awaitingRetry = false;
    chunkList = []; sessionId = null;
    sessionActive = false; paused = false; ending = false;
    document.body.classList.remove('session-live', 'dim-mode');
    consentCheck.disabled = false;
    clearNotice();
    recoveryCardEl.style.display = 'none';
    pauseCardEl.style.display = 'none';
    resetState();
    modalBg.classList.remove('show');
    toast('未送信データを削除しました');
  };

  // ===== タップで開始/停止(カード全体が対象) =====
  function toggle(){
    if(paused || ending) return; // 一時停止中は専用の再開ボタンのみで再開させる
    recording ? stop() : start();
  }
  clockCard.addEventListener('click', toggle);
  clockCard.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });

  // ===== 同意チェックの見た目連動 =====
  function updateConsentUI(){ clockCard.classList.toggle('disabled', !consentCheck.checked); }
  consentCheck.addEventListener('change', updateConsentUI);
  updateConsentUI();

  // ===== 初期化 =====
  renderHistory();
  checkForRecovery(); // 前回終了時に送信できていない録音が残っていないか確認する
  if(!localStorage.getItem(KEY)) setTimeout(openModal, 400);
})();
</script>
</body>
</html>
